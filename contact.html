<!DOCTYPE html>
<html>
  <head>
    <title>Hack On Hills - 2025</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="description" content="Hack on Hills 6.0 - Sixth edition of annual hackathon organized by App Team NITH" />
    <meta name="keywords" content="Hackathon,NITH,NIT,Hamirpur,Hack,On,Hills,App,Team,2018,Nimbus,Hillffair" />
    
    <!-- Other head elements -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="shortcut icon" href="./images/new_logo.png" type="image/x-icon" />
    <link rel="stylesheet" type="text/css" href="./css/main.css" />
    <link rel="stylesheet" type="text/css" href="./css/responsive.css" />
    <link href="https://fonts.googleapis.com/css?family=Didact+Gothic" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Lilita+One" rel="stylesheet" />
    
    <script src="https://code.jquery.com/jquery-3.3.1.js" integrity="sha256-2Kok7MbOyxpgUVvAk/HJ2jigOSYS2auK4Pfzbm7uH60=" crossorigin="anonymous"></script>
    
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-114940219-1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "UA-114940219-1");
    </script>
  </head>

  <body>
    <div class="content">
      <div class="appteam-logo">
        <a href="index.html"><img src="./images/images/new_logo.png" title="App Team NITH" /></a>
      </div>
      <div class="frame frame1">
        <canvas id="c"></canvas>
        <img src="./images/mountains.svg" />
        <div class="overlay"></div>
        <div class="frame1-text1">
          <h2>Contact Us</h2>
          <p>Have any questions? Feel free to reach out to us!</p>

          <form id="contactForm">
            <input placeholder="email" type="email" id="email" required />
            <textarea placeholder="message" id="message" required></textarea>
            <button type="submit">Send Message</button>
          </form>
          <div id="messageStatus" class="message-status"></div>
        </div>
      </div>
      
      <div class="frame frame6">
        <div class="footer-icons">
          <a href="https://github.com/appteam-nith/" target="__blank"><img src="./images/github.svg" /></a>
          <a href="https://www.instagram.com/hackonhills/" target="__blank"><img src="./images/insta.svg" /></a>
          <a href="mailto:hackonhills@gmail.com"><img src="./images/email.svg" /></a>
        </div>
        <div class="footer-text">&copy; 2025 Team Hack on Hills</div>
        Organised by <a href="https://www.instagram.com/appteam_nith/" target="_blank" class="footer-link"><img src="./images/images/appteam.png" /></a>
      </div>
    </div>

    <script type="module">
      // Import Firebase SDK
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.5.0/firebase-app.js";
      import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.5.0/firebase-firestore.js";

      // Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyAZVSOa17CtOlX68-ALnOmPvDJm3jy6M_0",
        authDomain: "hackonhills-710a6.firebaseapp.com",
        projectId: "hackonhills-710a6",
        storageBucket: "hackonhills-710a6.firebasestorage.app",
        messagingSenderId: "507755628378",
        appId: "1:507755628378:web:1323234ec328be724fd563",
        measurementId: "G-40ZMCEG4Q6"
      };

      // Initialize Firebase and Firestore
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      document.getElementById("contactForm").addEventListener("submit", async function (event) {
        event.preventDefault();

        // Get form data
        const email = document.getElementById("email").value;
        const message = document.getElementById("message").value;

        if (email && message) {
          try {
            // Add data to Firestore
            await addDoc(collection(db, "contactMessages"), {
              email: email,
              message: message,
              timestamp: new Date()
            });

            // Display success message
            document.getElementById("messageStatus").innerHTML = "<p style='color:green;'>Your message has been sent successfully! We'll get back to you soon.</p>";

            // Clear the form
            document.getElementById("contactForm").reset();
          } catch (error) {
            // Display error message if something goes wrong
            document.getElementById("messageStatus").innerHTML = "<p style='color:red;'>There was an error sending your message. Please try again later.</p>";
          }
        } else {
          // Display error message if fields are empty
          document.getElementById("messageStatus").innerHTML = "<p style='color:red;'>Please fill in all the fields before submitting.</p>";
        }
      });
    </script>
  </body>
</html>
